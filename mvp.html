<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastrar perfil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    background-color: #2b2b2b;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    min-height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #2b2b2b;
    padding: 30px 15px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    padding: 25px 30px 35px;
    border-radius: 6px;
    background: linear-gradient(to bottom, #4fb6d6 0%, #2f6fa3 55%, #1c3f63 100%);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    position: relative;
  }

  .btn-voltar {
    display: inline-block;
    padding: 5px 12px;
    margin-bottom: 18px;
    border: none;
    border-radius: 3px;
    background-color: #f2e2c4;
    color: #3a2f1f;
    font-size: 12px;
    cursor: pointer;
  }

  .btn-voltar:hover {
    background-color: #e8d4ab;
  }

  h1 {
    color: #0f2035;
    font-size: 26px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  h2 {
    color: #0f2035;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .icone-usuario {
    width: 34px;
    height: 34px;
    margin-bottom: 16px;
    color: #0f2035;
  }

  .campo {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }

  .campo label {
    width: 120px;
    flex-shrink: 0;
    color: #0f2035;
    font-size: 15px;
    font-weight: bold;
  }

  .campo input[type="text"],
  .campo input[type="number"],
  .campo input[type="password"],
  .campo select {
    flex: 1;
    padding: 8px 10px;
    border: none;
    border-radius: 3px;
    background-color: #e9e9e9;
    color: #333;
    font-size: 13px;
  }

  .campo input:focus,
  .campo select:focus {
    outline: 2px solid #1c3f63;
    background-color: #ffffff;
  }

  .campo input.invalido,
  .campo select.invalido {
    box-shadow: 0 0 0 2px #e05a5a;
  }

  .campo-arquivo {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-procurar {
    padding: 7px 14px;
    border: none;
    border-radius: 3px;
    background-color: #d8d8d8;
    color: #333;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .btn-procurar:hover {
    background-color: #c9c9c9;
  }

  #nomeArquivo {
    font-size: 12px;
    color: #0f2035;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  input[type="file"] {
    display: none;
  }

  .erro {
    color: #ffe0e0;
    font-size: 11px;
    margin: -4px 0 10px 128px;
    min-height: 14px;
  }

  .btn-cadastrar {
    display: block;
    margin-top: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 3px;
    background-color: #dcdcdc;
    color: #1c3f63;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-cadastrar:hover {
    background-color: #cfcfcf;
  }

  .btn-cadastrar[disabled] {
    opacity: 0.6;
    cursor: default;
  }

  .mensagem-geral {
    color: #ffe0e0;
    font-size: 12px;
    margin-top: 10px;
    min-height: 14px;
  }

  /* tela de sucesso */
  .sucesso {
    display: none;
    text-align: center;
    color: #eaf4fb;
    padding: 20px 0 10px;
  }

  .sucesso.mostrar {
    display: block;
    animation: fadeIn 0.3s forwards;
  }

  .cadastro-view.escondido {
    display: none;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  .avatar-preview {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid #eaeaea;
    object-fit: cover;
    margin: 0 auto 15px;
    display: block;
    background-color: #cfe3ee;
  }

  .resumo {
    text-align: left;
    background-color: rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 14px 18px;
    margin: 15px 0 20px;
    font-size: 13px;
    line-height: 1.6;
  }

  .resumo b {
    display: inline-block;
    width: 60px;
  }

  .btn-novo {
    padding: 9px 16px;
    border: 1px solid #cfe3ee;
    border-radius: 3px;
    background-color: transparent;
    color: #eaf4fb;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-novo:hover {
    background-color: rgba(255,255,255,0.1);
  }

  @media (max-width: 480px) {
    .campo {
      flex-direction: column;
      align-items: flex-start;
    }
    .campo label {
      width: auto;
      margin-bottom: 4px;
    }
    .erro {
      margin-left: 0;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="cadastro-view" id="cadastroView">
      <button type="button" class="btn-voltar" id="btnVoltar">voltar</button>

      <h1>CADASTRAR PERFIL</h1>
      <h2>Informações de usuário</h2>

      <svg class="icone-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
      </svg>

      <form id="cadastroForm">
        <div class="campo">
          <label for="campoNome">Nome:</label>
          <input type="text" id="campoNome" placeholder="Digite seu nome" autocomplete="off">
        </div>
        <div class="erro" id="erroNome"></div>

        <div class="campo">
          <label for="campoIdade">Idade:</label>
          <input type="number" id="campoIdade" placeholder="Digite sua idade" min="0" max="120">
        </div>
        <div class="erro" id="erroIdade"></div>

        <div class="campo">
          <label for="campoCidade">Cidade:</label>
          <input type="text" id="campoCidade" placeholder="Digite sua cidade" autocomplete="off">
        </div>
        <div class="erro" id="erroCidade"></div>

        <div class="campo">
          <label for="campoEstado">Estado:</label>
          <select id="campoEstado">
            <option value="" selected>selecione aqui</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
        </div>
        <div class="erro" id="erroEstado"></div>

        <div class="campo">
          <label for="campoFoto">Adicionar foto de perfil:</label>
          <div class="campo-arquivo">
            <button type="button" class="btn-procurar" id="btnProcurar">Procurar...</button>
            <span id="nomeArquivo">Nenhum arquivo selecionado.</span>
            <input type="file" id="campoFoto" accept="image/*">
          </div>
        </div>

        <div class="campo">
          <label for="campoSenha">Senha:</label>
          <input type="password" id="campoSenha" placeholder="Digite sua senha" autocomplete="off">
        </div>
        <div class="erro" id="erroSenha"></div>

        <button type="submit" class="btn-cadastrar" id="btnCadastrar">cadastrar</button>
        <div class="mensagem-geral" id="mensagemGeral"></div>
      </form>
    </div>

    <div class="sucesso" id="sucessoView">
      <img class="avatar-preview" id="fotoResumo" src="" alt="foto de perfil">
      <h1 style="font-size:20px;">Perfil cadastrado!</h1>
      <div class="resumo" id="resumo"></div>
      <button type="button" class="btn-novo" id="btnNovo">Cadastrar outro perfil</button>
    </div>

  </div>
</div>

<script>
  const cadastroView = document.getElementById('cadastroView');
  const sucessoView = document.getElementById('sucessoView');
  const form = document.getElementById('cadastroForm');

  const campoNome = document.getElementById('campoNome');
  const campoIdade = document.getElementById('campoIdade');
  const campoCidade = document.getElementById('campoCidade');
  const campoEstado = document.getElementById('campoEstado');
  const campoFoto = document.getElementById('campoFoto');
  const campoSenha = document.getElementById('campoSenha');

  const erroNome = document.getElementById('erroNome');
  const erroIdade = document.getElementById('erroIdade');
  const erroCidade = document.getElementById('erroCidade');
  const erroEstado = document.getElementById('erroEstado');
  const erroSenha = document.getElementById('erroSenha');
  const mensagemGeral = document.getElementById('mensagemGeral');

  const btnProcurar = document.getElementById('btnProcurar');
  const nomeArquivo = document.getElementById('nomeArquivo');
  const btnCadastrar = document.getElementById('btnCadastrar');
  const btnVoltar = document.getElementById('btnVoltar');
  const btnNovo = document.getElementById('btnNovo');

  const fotoResumo = document.getElementById('fotoResumo');
  const resumo = document.getElementById('resumo');

  let fotoDataUrl = '';

  btnProcurar.addEventListener('click', () => campoFoto.click());

  campoFoto.addEventListener('change', () => {
    if (campoFoto.files && campoFoto.files[0]) {
      const arquivo = campoFoto.files[0];
      nomeArquivo.textContent = arquivo.name;

      const leitor = new FileReader();
      leitor.onload = e => { fotoDataUrl = e.target.result; };
      leitor.readAsDataURL(arquivo);
    } else {
      nomeArquivo.textContent = 'Nenhum arquivo selecionado.';
      fotoDataUrl = '';
    }
  });

  function limparErros() {
    [erroNome, erroIdade, erroCidade, erroEstado, erroSenha, mensagemGeral].forEach(el => el.textContent = '');
    [campoNome, campoIdade, campoCidade, campoEstado, campoSenha].forEach(el => el.classList.remove('invalido'));
  }

  function marcarErro(campo, elErro, msg) {
    campo.classList.add('invalido');
    elErro.textContent = msg;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    limparErros();
    let valido = true;

    if (!campoNome.value.trim()) {
      marcarErro(campoNome, erroNome, 'Informe seu nome.');
      valido = false;
    }

    const idade = campoIdade.value.trim();
    if (!idade) {
      marcarErro(campoIdade, erroIdade, 'Informe sua idade.');
      valido = false;
    } else if (Number(idade) <= 0 || Number(idade) > 120) {
      marcarErro(campoIdade, erroIdade, 'Idade inválida.');
      valido = false;
    }

    if (!campoCidade.value.trim()) {
      marcarErro(campoCidade, erroCidade, 'Informe sua cidade.');
      valido = false;
    }

    if (!campoEstado.value) {
      marcarErro(campoEstado, erroEstado, 'Selecione um estado.');
      valido = false;
    }

    if (!campoSenha.value.trim()) {
      marcarErro(campoSenha, erroSenha, 'Informe uma senha.');
      valido = false;
    } else if (campoSenha.value.trim().length < 4) {
      marcarErro(campoSenha, erroSenha, 'A senha deve ter ao menos 4 caracteres.');
      valido = false;
    }

    if (!valido) {
      mensagemGeral.textContent = 'Corrija os campos destacados.';
      return;
    }

    btnCadastrar.disabled = true;
    btnCadastrar.textContent = 'Cadastrando...';

    setTimeout(function () {
      btnCadastrar.disabled = false;
      btnCadastrar.textContent = 'cadastrar';
      mostrarSucesso();
    }, 600);
  });

  function mostrarSucesso() {
    fotoResumo.src = fotoDataUrl || 'https://i.pravatar.cc/150?img=47';
    resumo.innerHTML =
      '<div><b>Nome:</b> ' + escapeHtml(campoNome.value.trim()) + '</div>' +
      '<div><b>Idade:</b> ' + escapeHtml(campoIdade.value.trim()) + '</div>' +
      '<div><b>Cidade:</b> ' + escapeHtml(campoCidade.value.trim()) + '</div>' +
      '<div><b>Estado:</b> ' + escapeHtml(campoEstado.value) + '</div>';

    cadastroView.classList.add('escondido');
    sucessoView.classList.add('mostrar');
  }

  function escapeHtml(txt) {
    const div = document.createElement('div');
    div.textContent = txt;
    return div.innerHTML;
  }

  btnNovo.addEventListener('click', function () {
    form.reset();
    limparErros();
    nomeArquivo.textContent = 'Nenhum arquivo selecionado.';
    fotoDataUrl = '';
    sucessoView.classList.remove('mostrar');
    cadastroView.classList.remove('escondido');
  });

  btnVoltar.addEventListener('click', function () {
    alert('Voltando para a tela anterior...');
  });
</script>

</body>
</html>
