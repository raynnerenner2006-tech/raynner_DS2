<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="pratica2.html"></a>
    <h1>Formulario de cadastro de usuário</h1>
    <form action="" method="get" name="cad_user">
        <label>Informe seu nome: <input type="text" name="" id="nome" required></label><br>
        <label>Informe sua senha: <input type="password" name="" id="senha"></label><br>
        <label>Informe seu E-mail: <input type="email" name="" id="email" placeholder="son67@gmail.com"></label><br>
        <label>Informe data de nascimento: <input type="date" name="" id="date"></label><br>

        <b>Qual seu meio de transporte principal?<br></b>
        <label><input type="radio" name="" id="transporte1" value="carro">Carro</label><br>
        <label><input type="radio" name="" id="transporte2" value="Bike">Bike</label><br>
        <label><input type="radio" name="" id="transporte3" value="Lancha">Lancha</label><br>

        <b>Qual seu meio de transporte secundario?</b>
        <label><br><input type="checkbox" name="" checked id="bus" value="onibus">Ônibus</label>
        <label><br><input type="checkbox" name="" checked id="aviao" value="aviao">Avião</label>
        <label><br><input type="checkbox" name="" checked id="barco" value="barco">Barco</label>
        <label><br></label>
        <b>Informe seu estado</b>
        <input type="submit" value="Enviar">
        <HR></HR>
        <table border="1">
            <tr>
                <td>Pessoa responsavel por esta solicitação</td>
                <td><input type="text" name="" id="prs"></td>
            </tr>
            <tr>
                <td>RG número</td>
                <td><input type="text" name="" id="rg"></td>
            </tr>
            <tr>
                <td>Expedido por:</td>
                <td><input type="text" name="" id="ep"></td>
            </tr>
            <tr>
                <td>E-mail para contato</td>
                <td><input type="text" name="" id="p"></td>
            </tr>
            <tr>
                <td>Motivo do cancelamento</td>
                <td><input type="text" name="" id="ep"></td>
            </tr>
        </table>

    </form>
    
</body>
</html>
